server {
    listen 80;
    server_name localhost;

    # Le dossier public de Laravel - point d'entree de toutes les requetes
    root /var/www/public;
    index index.php;

    # Taille max des fichiers envoyes (doit correspondre a php.ini)
    client_max_body_size 50M;

    location / {
        # Si le fichier existe, on le sert directement (images, CSS, JS)
        # Sinon, on envoie vers index.php (le routeur de Laravel)
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Passer la requete PHP a PHP-FPM
        # "php" est le nom du service dans docker-compose.yml
        fastcgi_pass php:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Timeout pour les requetes longues
        fastcgi_read_timeout 120;
    }

    # Bloquer l'acces aux fichiers caches (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
